---

- name: Create environment file directory
  ansible.builtin.file:
    path: "{{ _podman_quadlet_container.env.path | dirname }}"
    state: directory
    owner: "{{ item.owner | default(_podman_quadlet_container.owner) }}"
    group: "{{ item.group | default(_podman_quadlet_container.group) }}"
    mode: "{{ item.mode | default(_podman_quadlet_container.dir_mode) }}"

- name: Copy secret
  ansible.builtin.template:
    src: env.j2
    dest: "{{ _podman_quadlet_container.env.path }}"
    owner: "{{ item.owner | default(_podman_quadlet_container.owner) }}"
    group: "{{ item.group | default(_podman_quadlet_container.group) }}"
    mode: "{{ item.mode | default(_podman_quadlet_container.env.mode) }}"
  notify: Restart service
